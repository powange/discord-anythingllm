# Stack pensée pour un déploiement Git via Portainer.
# Les variables sont renseignées dans l'UI Portainer (section "Environment variables")
# au moment de créer la stack — d'où l'interpolation ${VAR} ci-dessous.
services:
  discord-anythingllm:
    build: .
    container_name: discord-anythingllm
    restart: unless-stopped
    # Interface HTTP de test (POST /ask), active seulement si TEST_API_TOKEN est défini.
    # Port publié sur le serveur pour le réseau local : ne pas le rediriger depuis Internet.
    ports:
      - "${TEST_API_HOST_PORT:-3105}:3000"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      ANYTHINGLLM_URL: ${ANYTHINGLLM_URL}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY}
      ANYTHINGLLM_WORKSPACE: ${ANYTHINGLLM_WORKSPACE}
      ANYTHINGLLM_MODE: ${ANYTHINGLLM_MODE:-chat}
      ANYTHINGLLM_AGENT: ${ANYTHINGLLM_AGENT:-false}
      QUERY_REFUSAL_RESPONSE: ${QUERY_REFUSAL_RESPONSE:-}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS:-}
      DEBUG: ${DEBUG:-false}
      RESPONSE_FOOTER: ${RESPONSE_FOOTER:-true}
      TEST_API_TOKEN: ${TEST_API_TOKEN:-}
      FIRST_BYTE_TIMEOUT_MS: ${FIRST_BYTE_TIMEOUT_MS:-300000}
      STREAM_IDLE_TIMEOUT_MS: ${STREAM_IDLE_TIMEOUT_MS:-60000}
      SOT_API_TOKEN: ${SOT_API_TOKEN:-}
      SOT_API_URL: ${SOT_API_URL:-https://achievements-sot.powange.com/api/agent}
      SOT_API_ENDPOINTS: ${SOT_API_ENDPOINTS:-wiki-names,release-notes,chest-items,recommendations,steam-news,rarethief-guides}
      WIKI_CATEGORIES: ${WIKI_CATEGORIES:-}
      STEAM_NEWS_DAYS: ${STEAM_NEWS_DAYS:-180}
      RARETHIEF_DAYS: ${RARETHIEF_DAYS:-90}
      SOT_SYNC_INTERVAL_HOURS: ${SOT_SYNC_INTERVAL_HOURS:-6}

networks:
  default:
    external: true
    name: proxy-network